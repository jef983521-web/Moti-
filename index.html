<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moti AI - Backend Connected</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0e1015;
            color: #e3e2e6;
            overflow-x: hidden;
            height: 100vh;
            height: 100dvh;
        }

        .montserrat-font {
            font-family: 'Montserrat', sans-serif;
        }

        .ambient-bg {
            background: radial-gradient(circle at 50% 100%, #152238 0%, #0d121c 50%, #0e1015 100%);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2f3a;
            border-radius: 4px;
        }

        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background-color: #a8c7fa;
            margin-left: 4px;
            vertical-align: -0.15em;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .logo-static {
            filter: drop-shadow(0 0 18px rgba(78, 143, 255, 0.25));
        }

        @keyframes shimmer {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }
        .shimmer {
            animation: shimmer 1.5s infinite ease-in-out;
        }

        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body pre { background: #12141c; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.75rem; border: 1px solid rgba(255,255,255,0.08); }
        .markdown-body code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.875em; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body strong { color: #f1f3f9; font-weight: 600; }
        .markdown-body a { color: #8ab4f8; text-decoration: underline; text-underline-offset: 2px; }
        .markdown-body blockquote { border-left: 3px solid #4e8fff; padding-left: 0.75rem; color: #9aa0a6; font-style: italic; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="ambient-bg flex flex-col h-screen select-none justify-between overflow-hidden">

    <!-- Sidebar Overlay & Panel -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-35 opacity-0 pointer-events-none transition-opacity duration-300"></div>
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-80 bg-[#12141c] border-r border-white/10 flex flex-col transform -translate-x-full transition-transform duration-300 shadow-2xl">
        <div class="p-4 border-b border-white/10 flex items-center justify-between">
            <img src="https://i.postimg.cc/sDh14n3n/1000016663-removebg-preview.png" alt="Moti Logo" class="w-8 h-8 object-contain logo-static">
            <button id="closeSidebarBtn" class="p-1.5 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-colors">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="p-3">
            <button id="sidebarNewChatBtn" class="w-full py-2.5 px-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-xs font-medium text-gray-200 transition-all flex items-center justify-center gap-2">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span>Nuevo Chat</span>
            </button>
        </div>
        <div id="sessionList" class="flex-1 overflow-y-auto px-3 py-2 flex flex-col gap-1">
            <!-- Dynamic session items inserted here -->
        </div>
        <div id="adminPanelSection" class="p-4 border-t border-white/10 hidden">
            <button id="exportAdminBtn" class="w-full py-2 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs text-emerald-400 hover:bg-emerald-500/20 transition-all flex items-center justify-center gap-1.5">
                <span>📥 Exportar Auditoría JSON</span>
            </button>
        </div>
    </aside>

    <header class="w-full px-4 pt-3 pb-2 flex items-center justify-between z-30">
        <!-- Left Section: Hamburger Menu -->
        <div class="flex items-center gap-2">
            <button id="menuBtn" class="p-2 rounded-full hover:bg-white/10 text-gray-300 transition-colors active:scale-95" title="Menú">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="7" x2="20" y2="7"></line>
                    <line x1="4" y1="17" x2="20" y2="17"></line>
                </svg>
            </button>
            <span id="headerUserName" class="text-sm font-medium text-gray-300 hidden sm:inline-block">Moti AI</span>
        </div>

        <!-- Right Section: New Chat Button -->
        <div class="flex items-center gap-2">
            <button id="newChatBtn" class="p-2 rounded-full hover:bg-white/10 text-gray-300 transition-colors active:scale-95" title="Nuevo Chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                    <path d="M5 3v4"/>
                    <path d="M19 17v4"/>
                    <path d="M3 5h4"/>
                    <path d="M17 19h4"/>
                </svg>
            </button>
        </div>
    </header>

    <main id="chatContainer" class="flex-1 flex flex-col justify-center items-center px-4 sm:px-6 overflow-y-auto w-full max-w-3xl mx-auto transition-all">
        
        <!-- Default Welcome View -->
        <div id="welcomeView" class="flex flex-col items-center text-center my-auto py-8 transition-opacity duration-300">
            <div class="mb-6 relative">
                <img 
                    src="https://i.postimg.cc/sDh14n3n/1000016663-removebg-preview.png" 
                    alt="Moti Logo" 
                    class="w-20 h-20 sm:w-24 sm:h-24 object-contain logo-static"
                    onerror="this.src='https://placehold.co/120x120/1e293b/ffffff?text=Moti'"
                >
            </div>

            <h1 class="montserrat-font text-2xl sm:text-3xl md:text-4xl font-medium text-[#e3e2e6] tracking-tight leading-snug max-w-xl min-h-[4rem] sm:min-h-[5rem] flex items-center justify-center flex-wrap">
                <span id="typedTitle"></span><span id="cursor" class="typing-cursor"></span>
            </h1>

            <div id="suggestionsGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mt-8 w-full max-w-xl opacity-0 transition-opacity duration-500">
                <button class="suggestion-btn text-left p-3.5 bg-white/5 hover:bg-white/10 border border-white/5 rounded-2xl transition-all text-xs text-gray-300 hover:text-white flex flex-col justify-between h-24">
                    <span>💡 Explícame un concepto complejo de forma sencilla</span>
                    <span class="text-[10px] text-gray-500 font-medium">Análisis inteligente</span>
                </button>
                <button class="suggestion-btn text-left p-3.5 bg-white/5 hover:bg-white/10 border border-white/5 rounded-2xl transition-all text-xs text-gray-300 hover:text-white flex flex-col justify-between h-24">
                    <span>⚡ ¿Qué es la clave secreta Golden ID?</span>
                    <span class="text-[10px] text-gray-500 font-medium">Comando especial</span>
                </button>
                <button class="suggestion-btn text-left p-3.5 bg-white/5 hover:bg-white/10 border border-white/5 rounded-2xl transition-all text-xs text-gray-300 hover:text-white flex flex-col justify-between h-24">
                    <span>🔍 Analiza las últimas tendencias tecnológicas</span>
                    <span class="text-[10px] text-gray-500 font-medium">Pensamiento crítico</span>
                </button>
            </div>
        </div>

        <!-- Dynamic Message Feed -->
        <div id="messageList" class="w-full flex flex-col gap-6 py-6 hidden"></div>
    </main>

    <footer class="w-full max-w-2xl mx-auto px-4 pb-6 pt-2 z-30">
        <div class="bg-[#1e1f20]/90 backdrop-blur-md rounded-full flex items-center px-4 py-2.5 shadow-2xl border border-white/5 focus-within:border-white/20 transition-all">
            <input 
                type="text" 
                id="userInput"
                placeholder="Pregunta a Moti..." 
                class="w-full bg-transparent text-gray-100 placeholder-gray-400 focus:outline-none text-base px-2 py-1 font-normal select-text"
                autocomplete="off"
            >
            <button id="sendBtn" class="p-2 rounded-full text-gray-300 hover:bg-white/10 active:scale-90 transition-all ml-1 flex-shrink-0" title="Enviar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a8c7fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#282c37] text-gray-200 text-xs px-4 py-2.5 rounded-full shadow-lg border border-white/10 opacity-0 transition-all pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">Notificación</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fullText = "Hola, soy Moti, ¿en qué te puedo ayudar?";
            const typedTitleEl = document.getElementById('typedTitle');
            const suggestionsGrid = document.getElementById('suggestionsGrid');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const welcomeView = document.getElementById('welcomeView');
            const messageList = document.getElementById('messageList');
            const chatContainer = document.getElementById('chatContainer');
            const newChatBtn = document.getElementById('newChatBtn');
            const sidebarNewChatBtn = document.getElementById('sidebarNewChatBtn');
            const menuBtn = document.getElementById('menuBtn');
            const closeSidebarBtn = document.getElementById('closeSidebarBtn');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const sessionList = document.getElementById('sessionList');
            const adminPanelSection = document.getElementById('adminPanelSection');
            const exportAdminBtn = document.getElementById('exportAdminBtn');
            const headerUserName = document.getElementById('headerUserName');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            let charIndex = 0;
            const typingSpeed = 40;
            
            // State variables for backend sync
            let userId = localStorage.getItem('moti_user_id') || '';
            let userName = localStorage.getItem('moti_user_name') || '';
            let currentSessionId = null;
            let isAdmin = false;

            // --- Typewriter Effect ---
            function typeWriter() {
                if (charIndex < fullText.length) {
                    typedTitleEl.textContent += fullText.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, typingSpeed);
                } else {
                    if (suggestionsGrid) suggestionsGrid.classList.remove('opacity-0');
                }
            }
            setTimeout(typeWriter, 300);

            function showToast(msg) {
                toastMsg.textContent = msg;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 3000);
            }

            function toggleSidebar(open) {
                if (open) {
                    sidebar.classList.remove('-translate-x-full');
                    sidebarOverlay.classList.remove('opacity-0', 'pointer-events-none');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    sidebarOverlay.classList.add('opacity-0', 'pointer-events-none');
                }
            }

            menuBtn.addEventListener('click', () => toggleSidebar(true));
            closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
            sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

            // --- 1 & 2. Autenticación Pasiva & Carga de Sesiones ---
            async function initAuthAndSessions() {
                try {
                    const res = await fetch('/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId, name: userName })
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        userId = data.user_id;
                        userName = data.name;
                        isAdmin = data.is_admin;
                        
                        localStorage.setItem('moti_user_id', userId);
                        localStorage.setItem('moti_user_name', userName);
                        
                        headerUserName.textContent = `Moti AI (${userName})`;

                        if (isAdmin) {
                            adminPanelSection.classList.remove('hidden');
                        }

                        await loadSessions();
                    }
                } catch (e) {
                    console.error("Auth error:", e);
                    showToast("No se pudo conectar con el servidor backend Flask");
                }
            }

            // --- 3. Sincronización de Sesiones (/api/sessions) ---
            async function loadSessions() {
                if (!userId) return;
                try {
                    const res = await fetch(`/api/sessions?user_id=${userId}`);
                    const data = await res.json();
                    sessionList.innerHTML = '';
                    
                    if (data.sessions && data.sessions.length > 0) {
                        data.sessions.forEach(s => {
                            const btn = document.createElement('button');
                            btn.className = `w-full text-left px-3.5 py-2.5 rounded-xl text-xs transition-colors truncate flex items-center justify-between ${s.session_id === currentSessionId ? 'bg-white/10 text-white font-medium' : 'text-gray-400 hover:bg-white/5 hover:text-gray-200'}`;
                            btn.innerHTML = `<span class="truncate">${escapeHtml(s.title || 'Nueva Conversación')}</span>`;
                            btn.addEventListener('click', () => selectSession(s.session_id));
                            sessionList.appendChild(btn);
                        });
                    } else {
                        sessionList.innerHTML = '<p class="text-xs text-gray-500 px-3 py-2">No hay conversaciones aún.</p>';
                    }
                } catch (e) {
                    console.error("Error loading sessions:", e);
                }
            }

            async function createNewSession(title = 'Nueva Conversación') {
                try {
                    const res = await fetch('/api/sessions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId, title: title })
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        currentSessionId = data.session_id;
                        await loadSessions();
                        return currentSessionId;
                    }
                } catch (e) {
                    console.error("Error creating session:", e);
                }
                return null;
            }

            async function selectSession(sessionId) {
                currentSessionId = sessionId;
                toggleSidebar(false);
                loadSessions();

                try {
                    const res = await fetch(`/api/messages?session_id=${sessionId}`);
                    const data = await res.json();
                    messageList.innerHTML = '';

                    if (data.messages && data.messages.length > 0) {
                        welcomeView.classList.add('hidden');
                        messageList.classList.remove('hidden');
                        chatContainer.classList.remove('justify-center');
                        chatContainer.classList.add('justify-start');

                        data.messages.forEach(msg => {
                            if (msg.sender === 'user') {
                                appendUserMessageDirect(msg.text);
                            } else {
                                appendMotiMessageDirect(msg.text);
                            }
                        });
                    } else {
                        messageList.classList.add('hidden');
                        welcomeView.classList.remove('hidden');
                        chatContainer.classList.add('justify-center');
                        chatContainer.classList.remove('justify-start');
                    }
                } catch (e) {
                    console.error("Error loading messages:", e);
                }
            }

            function resetToNewChat() {
                currentSessionId = null;
                messageList.innerHTML = '';
                messageList.classList.add('hidden');
                welcomeView.classList.remove('hidden');
                chatContainer.classList.add('justify-center');
                chatContainer.classList.remove('justify-start');
                loadSessions();
                showToast("Nueva conversación iniciada ✨");
            }

            newChatBtn.addEventListener('click', resetToNewChat);
            sidebarNewChatBtn.addEventListener('click', () => {
                toggleSidebar(false);
                resetToNewChat();
            });

            // --- Render Helpers ---
            function escapeHtml(str) {
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            }

            function appendUserMessageDirect(text) {
                const userMsg = document.createElement('div');
                userMsg.className = 'self-end flex flex-col items-end max-w-[85%]';
                userMsg.innerHTML = `
                    <div class="bg-[#2b2f3a] text-gray-100 px-5 py-3 rounded-2xl rounded-tr-sm text-sm leading-relaxed shadow-sm">
                        ${escapeHtml(text)}
                    </div>
                `;
                messageList.appendChild(userMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function appendMotiMessageDirect(text) {
                const motiMsg = document.createElement('div');
                motiMsg.className = 'self-start flex gap-3 items-start max-w-[92%] sm:max-w-[85%] text-sm text-gray-200 leading-relaxed';
                const renderedHtml = window.marked ? marked.parse(text) : escapeHtml(text);
                
                motiMsg.innerHTML = `
                    <img src="https://i.postimg.cc/sDh14n3n/1000016663-removebg-preview.png" class="w-6 h-6 object-contain mt-1 flex-shrink-0 logo-static" alt="Moti">
                    <div class="bg-[#1e1f20] px-5 py-3.5 rounded-2xl rounded-tl-sm border border-white/5 w-full">
                        <div class="markdown-body text-sm leading-relaxed">${renderedHtml}</div>
                    </div>
                `;
                messageList.appendChild(motiMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function createMotiLoadingBubble() {
                const motiMsg = document.createElement('div');
                motiMsg.className = 'self-start flex gap-3 items-start max-w-[92%] sm:max-w-[85%] text-sm text-gray-200 leading-relaxed';
                motiMsg.innerHTML = `
                    <img src="https://i.postimg.cc/sDh14n3n/1000016663-removebg-preview.png" class="w-6 h-6 object-contain mt-1 flex-shrink-0 logo-static" alt="Moti">
                    <div class="bg-[#1e1f20] px-5 py-3.5 rounded-2xl rounded-tl-sm border border-white/5 w-full">
                        <div class="content-area">
                            <div class="flex items-center gap-2 text-gray-400 text-xs shimmer">
                                <span class="w-2 h-2 bg-blue-400 rounded-full animate-ping"></span>
                                <span>Moti está pensando...</span>
                            </div>
                        </div>
                    </div>
                `;
                messageList.appendChild(motiMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return motiMsg;
            }

            // --- 4. Desacoplar API de Google: Envío a Flask /api/messages ---
            async function sendMessage() {
                const text = userInput.value.trim();
                if (!text) return;

                // Si no hay sesión activa, crear una automáticamente con un título breve
                if (!currentSessionId) {
                    const titleSummary = text.length > 25 ? text.substring(0, 25) + '...' : text;
                    await createNewSession(titleSummary);
                }

                if (!welcomeView.classList.contains('hidden')) {
                    welcomeView.classList.add('hidden');
                    messageList.classList.remove('hidden');
                    chatContainer.classList.remove('justify-center');
                    chatContainer.classList.add('justify-start');
                }

                const currentText = text;
                userInput.value = '';

                appendUserMessageDirect(currentText);

                const motiBubble = createMotiLoadingBubble();
                const contentArea = motiBubble.querySelector('.content-area');

                try {
                    const res = await fetch('/api/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: userId,
                            session_id: currentSessionId,
                            text: currentText
                        })
                    });

                    const result = await res.json();
                    if (result.status === 'success') {
                        if (result.admin_elevated) {
                            isAdmin = true;
                            adminPanelSection.classList.remove('hidden');
                            showToast("🔑 Golden ID Activado: Administrador");
                        }

                        const responseText = result.reply;
                        const renderedHtml = window.marked ? marked.parse(responseText) : escapeHtml(responseText);

                        contentArea.innerHTML = `
                            <div class="markdown-body text-sm leading-relaxed">${renderedHtml}</div>
                            <div class="flex items-center gap-3 mt-3 pt-2 text-xs text-gray-400 border-t border-white/5">
                                <button class="copy-btn hover:text-white flex items-center gap-1 transition-colors">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                    <span>Copiar</span>
                                </button>
                            </div>
                        `;

                        contentArea.querySelector('.copy-btn').addEventListener('click', () => {
                            const dummy = document.createElement('textarea');
                            dummy.value = responseText;
                            document.body.appendChild(dummy);
                            dummy.select();
                            document.execCommand('copy');
                            document.body.removeChild(dummy);
                            showToast("Copiado al portapapeles 📋");
                        });

                        loadSessions();
                    } else {
                        contentArea.innerHTML = `<p class="text-red-400 text-xs">${escapeHtml(result.error || 'Error procesando respuesta')}</p>`;
                    }

                } catch (err) {
                    console.error("Backend Error:", err);
                    contentArea.innerHTML = `<p class="text-red-400 text-xs">Error conectando con Flask: ${escapeHtml(err.message)}</p>`;
                } finally {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }

            // Admin Export Button Listener
            exportAdminBtn.addEventListener('click', () => {
                if (!isAdmin) return;
                window.location.href = `/api/admin/export?user_id=${userId}`;
            });

            // Suggestion cards click handler
            document.querySelectorAll('.suggestion-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const text = btn.querySelector('span:first-child').textContent.replace(/^[💡⚡🔍]\s*/, '');
                    userInput.value = text;
                    sendMessage();
                });
            });

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener('click', sendMessage);

            // Inicializar al cargar la página
            initAuthAndSessions();
        });
    </script>
</body>
</html>
